name: Publish npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Stable release tag to retry (for example v0.2.6)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  npm:
    if: >-
      github.repository == 'Totoro-qaq/dsh-jot' &&
      ((github.event_name == 'release' && !github.event.release.prerelease) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      # Keep the publisher on protected main, including when retrying an old tag.
      - name: Check out publishing tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Validate release tag
        run: node scripts/npm-release.mjs validate-tag "$RELEASE_TAG"
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Require reviewed main history
        working-directory: candidate
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - name: Install pinned npm with trusted-publishing support
        run: npm install --global npm@12.2.0
      - name: Check package and registry
        id: preflight
        run: node scripts/npm-release.mjs preflight "$RELEASE_TAG" candidate
      - name: Set up pnpm
        if: steps.preflight.outputs.publish == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: candidate/package.json
          run_install: false
          cache: false
      - name: Install locked dependencies
        if: steps.preflight.outputs.publish == 'true'
        working-directory: candidate
        run: pnpm install --frozen-lockfile
      - name: Check and build release
        if: steps.preflight.outputs.publish == 'true'
        working-directory: candidate
        run: pnpm check && pnpm pack:check
      - name: Pack checked bytes
        if: steps.preflight.outputs.publish == 'true'
        working-directory: candidate
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - name: Publish with OIDC
        if: steps.preflight.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.preflight.outputs.version }}
        run: node scripts/npm-release.mjs publish "$RELEASE_TAG" candidate "$RUNNER_TEMP/dsh-jot-$RELEASE_VERSION.tgz"
